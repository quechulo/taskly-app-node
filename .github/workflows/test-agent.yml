name: Test agent

# Creates or updates unit tests for the code changed in a pull request:
#   detect   -> deterministic change analysis, decides whether to run
#   generate -> test-engineer agent (Claude Agent SDK); read-only token, API key only in its step
#   verify   -> independent re-run on a clean checkout; no secrets
#   publish  -> commits the verified patch and posts the PR comment; never executes PR code
#
# The agent definition, skills, runner and pipeline scripts are always taken from the
# base commit ("trusted"), so a pull request cannot change its own guardrails.
# Untrusted values (branch names, etc.) reach scripts only through env variables.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  detect:
    name: Analyze changes
    # Fork PRs get no secrets; drafts and opted-out PRs are skipped.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted agent configuration (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Find the last commit the agent processed
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Only our own bot comment is trusted; detect.mjs also checks the SHA is an ancestor.
        run: |
          sha=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- test-agent-report -->"))) | .body' \
            | grep -oE 'test-agent:last-sha=[0-9a-f]{40}' | tail -n 1 | cut -d= -f2 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Analyze changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAST_SHA: ${{ steps.last.outputs.sha }}
        run: node trusted/.github/test-agent/detect.mjs --repo pr --base "$BASE_SHA" --head "$HEAD_SHA" --last "$LAST_SHA" --out "$RUNNER_TEMP/changes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes.json
          retention-days: 14

  generate:
    name: Generate tests
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted agent configuration (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            pr/backend/package-lock.json
            pr/frontend/package-lock.json
            trusted/.github/test-agent/runner/package-lock.json
      - name: Install application dependencies
        env:
          BACKEND: ${{ needs.detect.outputs.backend }}
          FRONTEND: ${{ needs.detect.outputs.frontend }}
        run: |
          if [ "$BACKEND" = true ]; then npm ci --prefix pr/backend; fi
          if [ "$FRONTEND" = true ]; then npm ci --prefix pr/frontend; fi
      - name: Install agent runner
        run: npm ci --prefix trusted/.github/test-agent/runner
      - name: Enable subprocess isolation (bubblewrap)
        # Claude Code needs bubblewrap on Linux for CLAUDE_CODE_SUBPROCESS_ENV_SCRUB (credential
        # scrubbing and PID isolation of hook subprocesses). Ubuntu 24.04 blocks unprivileged user
        # namespaces through AppArmor; this ephemeral runner VM is reconfigured to allow them.
        # The final probe fails the job here, before any API spend, if isolation does not work.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-user true
          echo "bubblewrap $(bwrap --version) works"
      - name: Run test-engineer agent
        # The only step with the API key. The agent has no shell; test processes get a minimal env.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL }}
          TEST_AGENT_MAX_BUDGET_USD: ${{ vars.TEST_AGENT_MAX_BUDGET_USD }}
          BACKEND: ${{ needs.detect.outputs.backend }}
          FRONTEND: ${{ needs.detect.outputs.frontend }}
        run: |
          apps=$( { [ "$BACKEND" = true ] && echo backend; [ "$FRONTEND" = true ] && echo frontend; } | paste -sd, - )
          npm --prefix trusted/.github/test-agent/runner run agent -- \
            --mode pr \
            --repo "$GITHUB_WORKSPACE/pr" \
            --config-root "$GITHUB_WORKSPACE/trusted" \
            --changes "$RUNNER_TEMP/changes.json" \
            --apps "$apps" \
            --out "$RUNNER_TEMP/agent"
      - name: Format generated frontend tests
        if: needs.detect.outputs.frontend == 'true'
        working-directory: pr
        run: |
          git add -A
          git diff --cached --name-only --diff-filter=AM -- 'frontend/src/**' \
            | grep -E '\.test\.tsx?$|^frontend/src/test/' \
            | xargs -r node frontend/node_modules/prettier/bin/prettier.cjs --config frontend/.prettierrc.json --write || true
      - name: Create patch
        if: always()
        working-directory: pr
        run: |
          mkdir -p "$RUNNER_TEMP/agent"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/agent/tests.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent
          path: ${{ runner.temp }}/agent/
          retention-days: 14
          if-no-files-found: warn

  verify:
    name: Verify tests
    needs: [detect, generate]
    if: needs.generate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted pipeline scripts (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            pr/backend/package-lock.json
            pr/frontend/package-lock.json
      - name: Install application dependencies
        id: apps
        env:
          BACKEND: ${{ needs.detect.outputs.backend }}
          FRONTEND: ${{ needs.detect.outputs.frontend }}
        run: |
          patch="$RUNNER_TEMP/agent/tests.patch"
          apps=""
          if [ "$BACKEND" = true ] || grep -q '^diff --git a/backend/' "$patch" 2>/dev/null; then npm ci --prefix pr/backend; apps="backend"; fi
          if [ "$FRONTEND" = true ] || grep -q '^diff --git a/frontend/' "$patch" 2>/dev/null; then npm ci --prefix pr/frontend; apps="${apps:+$apps,}frontend"; fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
      - name: Verify patch, types, tests (twice) and coverage
        env:
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          node trusted/.github/test-agent/verify.mjs --repo pr --apps "$APPS" \
            --patch "$RUNNER_TEMP/agent/tests.patch" --changes "$RUNNER_TEMP/changes.json" --out "$RUNNER_TEMP/verify"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification
          path: |
            ${{ runner.temp }}/verify/verification.json
            ${{ runner.temp }}/verify/applied.patch
          retention-days: 14
      - name: Fail when verification did not pass
        run: node -e "const s=require(process.env.RUNNER_TEMP+'/verify/verification.json').status; console.log('status:', s); process.exit(['passed','no-changes'].includes(s)?0:1)"

  publish:
    name: Publish results
    needs: [detect, generate, verify]
    if: always() && needs.detect.outputs.should_run == 'true' && needs.generate.result != 'cancelled' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the verified test commit
      pull-requests: write # sticky PR comment
      actions: write # dispatch CI for the pushed commit
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted pipeline scripts (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: changes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent
          path: ${{ runner.temp }}/agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: verification
          path: ${{ runner.temp }}/verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide outcome
        id: outcome
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
        run: |
          status=$(node -e "try{console.log(require(process.env.RUNNER_TEMP+'/verify/verification.json').status)}catch{console.log('missing')}")
          if [ "$GENERATE_RESULT" != success ]; then outcome=agent-failed
          elif [ "$status" = passed ]; then outcome=commit
          elif [ "$status" = no-changes ]; then outcome=no-changes
          else outcome=not-committed; fi
          echo "verification=$status outcome=$outcome"
          echo "value=$outcome" >> "$GITHUB_OUTPUT"
      - name: Checkout pull request branch
        if: steps.outcome.outputs.value == 'commit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr
      - name: Commit verified tests
        id: commit
        if: steps.outcome.outputs.value == 'commit'
        working-directory: pr
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          patch="$RUNNER_TEMP/verify/applied.patch"
          # Only commit on top of the exact commit the tests were generated and verified for.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Re-check the exact bytes being committed with the trusted gate; no PR code runs in this job.
          node ../trusted/.github/test-agent/check-patch.mjs "$patch" > /dev/null
          git apply --index --whitespace=nowarn "$patch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -F - <<EOF
          test: add unit tests for changes in PR #$PR_NUMBER

          Generated by the test-engineer agent and verified independently in
          $RUN_URL

          Test-Agent: generated
          EOF
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run CI for the new commit
        if: steps.commit.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Render report
        env:
          DECIDED_OUTCOME: ${{ steps.outcome.outputs.value }}
          STALE: ${{ steps.commit.outputs.stale }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          outcome="$DECIDED_OUTCOME"
          if [ "$outcome" = commit ]; then outcome=committed; fi
          if [ "$STALE" = true ]; then outcome=stale; fi
          node trusted/.github/test-agent/render-comment.mjs \
            --report "$RUNNER_TEMP/agent/report.json" \
            --verification "$RUNNER_TEMP/verify/verification.json" \
            --changes "$RUNNER_TEMP/changes.json" \
            --head "$HEAD_SHA" --run-url "$RUN_URL" --outcome "$outcome" --commit "$COMMIT" > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- test-agent-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          fi
